name: Build Kernel for Poco X3 NFC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            flex \
            bison \
            cpio \
            git \
            curl \
            zip \
            unzip \
            clang \
            lld \
            llvm \
            python3

      - name: Download Official LineageOS Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_surya
          ref: lineage-20
          path: kernel-source

      - name: Apply Performance Tweaks
        run: |
          cd kernel-source

          # GPU frequency
          sed -i 's/575000000/650000000/g' \
            arch/arm64/boot/dts/vendor/qcom/sm6150-gpu.dtsi || true

          sed -i 's/610000000/650000000/g' \
            arch/arm64/boot/dts/vendor/qcom/sm6150-gpu.dtsi || true

          # CPU frequency
          sed -i 's/2304000/2457600/g' \
            arch/arm64/boot/dts/vendor/qcom/sm6150.dtsi || true

          # Remove previous duplicate config entries
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=/d' \
            arch/arm64/configs/surya_defconfig

          sed -i '/CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=/d' \
            arch/arm64/configs/surya_defconfig

          sed -i '/CONFIG_HZ_1000=/d' \
            arch/arm64/configs/surya_defconfig

          sed -i '/CONFIG_HZ=/d' \
            arch/arm64/configs/surya_defconfig

          # Performance configuration
          echo 'CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y' >> \
            arch/arm64/configs/surya_defconfig

          echo 'CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y' >> \
            arch/arm64/configs/surya_defconfig

          echo 'CONFIG_HZ_1000=y' >> \
            arch/arm64/configs/surya_defconfig

          echo 'CONFIG_HZ=1000' >> \
            arch/arm64/configs/surya_defconfig

      - name: Build Kernel
        run: |
          cd kernel-source

          export ARCH=arm64
          export SUBARCH=arm64

          make O=out surya_defconfig

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package AnyKernel3 Flashable Zip
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          if [ -f kernel-source/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz-dtb \
              AnyKernel3/
          elif [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz \
              AnyKernel3/
          else
            echo "Kernel image not found!"
            exit 1
          fi

          cd AnyKernel3

          zip -r9 ../Overclocked-Kernel-PocoX3.zip . \
            -x '.git/*' '*.md'

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Overclocked-Kernel-PocoX3
          path: Overclocked-Kernel-PocoX3.zip
