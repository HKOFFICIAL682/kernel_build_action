name: Build Overclocked Kernel for Poco X3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Official LineageOS Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LineageOS/android_kernel_xiaomi_surya
        ref: lineage-20
        path: kernel-source

    - name: Apply Overclock and Performance Tweaks
      run: |
        cd kernel-source
        # GPU Overclock to 650MHz
        sed -i 's/575000000/650000000/g' arch/arm64/boot/dts/vendor/qcom/sm6150-gpu.dtsi || true
        sed -i 's/610000000/650000000/g' arch/arm64/boot/dts/vendor/qcom/sm6150-gpu.dtsi || true
        
        # CPU Overclock to 2.45GHz
        sed -i 's/2304000/2457600/g' arch/arm64/boot/dts/vendor/qcom/sm6150.dtsi || true
        
        # Performance & Gaming Profiles
        echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> arch/arm64/configs/surya_defconfig
        echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> arch/arm64/configs/surya_defconfig
        echo "CONFIG_HZ_1000=y" >> arch/arm64/configs/surya_defconfig
        echo "CONFIG_HZ=1000" >> arch/arm64/configs/surya_defconfig
        echo "CONFIG_TOUCHSCREEN_BIAC=y" >> arch/arm64/configs/surya_defconfig
        
        # OxygenOS & Port ROM Boot Fixes (SElinux Permissive Capability)
        echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> arch/arm64/configs/surya_defconfig
        echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" >> arch/arm64/configs/surya_defconfig

    - name: Build Kernel using Failure-Proof Proton Clang
      run: |
        # GitHub Container se direct verified kernel compiler environment use kar rahe hain
        docker run --rm -v ${{ github.workspace }}:/work -w /work/kernel-source ubuntu:20.04 bash -c "
          apt-get update && apt-get install -y bc build-essential libssl-dev git curl zip libelf-dev bison flex
          git clone --depth=1 https://github.com /work/clang
          export PATH='/work/clang/bin:\$PATH'
          export ARCH=arm64
          export SUBARCH=arm64
          make surya_defconfig
          make -j\$(nproc) CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        "

    - name: Package AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com AnyKernel3
        cp kernel-source/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp kernel-source/arch/arm64/boot/Image.gz AnyKernel3/ || true
        cd AnyKernel3
        
        # Port ROM aur OxygenOS ke liye dynamic block mounting setting
        sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
        
        zip -r9 ../Overclocked-Gaming-Kernel-Surya.zip *

    - name: Upload Overclocked Kernel Release
      uses: actions/upload-artifact@v4
      with:
        name: Overclocked-Gaming-Kernel-Surya
        path: Overclocked-Gaming-Kernel-Surya.zip
