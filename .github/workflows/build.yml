name: Build Kernel for Poco X3

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel Core
    runs-on: ubuntu-latest
    steps:
      - name: Build Engine Execution
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com
          kernel-branch: lineage-20
          config: surya_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 13
          anykernel3: true
