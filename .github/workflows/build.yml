name: Build POCO X3 NFC Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Build Kernel
        uses: HKOFFICIAL682/kernel_build_action@main
        with:
          kernel-url: https://github.com/LineageOS/android_kernel_xiaomi_surya
          kernel-branch: lineage-20
          config: surya_defconfig
          arch: arm64
          android-version: 13
          aosp-clang: true
          anykernel3: true
