name: Build Kernel for Poco X3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libssl-dev libcrypto++-dev tcl-dev tk-dev uuid-dev libgpgme-dev gnupg2 git curl zip libelf-dev lld llvm

    - name: Clone Proton Clang Toolchain (Foolproof Download)
      run: |
        # Proton Clang android kernel building ke liye sab se best aur stable mana jata hai aur error nahi deta
        git clone --depth=1 https://github.com toolchains/clang

    - name: Download Official LineageOS Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LineageOS/android_kernel_xiaomi_surya
        ref: lineage-20
        path: kernel-source

    - name: Apply Overclock and High Bullet Register Tweaks
      run: |
        cd kernel-source
        sed -i 's/575000000/650000000/g' arch/arm64/boot/dts/vendor/qcom/sm6150-gpu.dtsi || true
        sed -i 's/610000000/650000000/g' arch/arm64/boot/dts/vendor/qcom/sm6150-gpu.dtsi || true
        sed -i 's/2304000/2457600/g' arch/arm64/boot/dts/vendor/qcom/sm6150.dtsi || true
        echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> arch/arm64/configs/surya_defconfig
        echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> arch/arm64/configs/surya_defconfig
        echo "CONFIG_HZ_1000=y" >> arch/arm64/configs/surya_defconfig
        echo "CONFIG_HZ=1000" >> arch/arm64/configs/surya_defconfig
        echo "CONFIG_TOUCHSCREEN_BIAC=y" >> arch/arm64/configs/surya_defconfig
        
        # OxygenOS Port boot karne ke liye SElinux settings
        echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> arch/arm64/configs/surya_defconfig
        echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" >> arch/arm64/configs/surya_defconfig

    - name: Build Kernel Core
      run: |
        cd kernel-source
        
        # Proton Clang ka path configure kiya
        export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Defconfig load karein
        make surya_defconfig
        
        # Proton Clang ke saath stable compilation command
        make -j$(nproc) \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package AnyKernel3 Flashable Zip
      run: |
        git clone https://github.com AnyKernel3
        cp kernel-source/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp kernel-source/arch/arm64/boot/Image.gz AnyKernel3/ || true
        cd AnyKernel3
        
        # OxygenOS Port block aur slot detection fix
        sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
        
        zip -r9 ../Overclocked-Kernel-PocoX3.zip *

    - name: Upload Flashable Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Overclocked-Kernel-PocoX3
        path: Overclocked-Kernel-PocoX3.zip
