name: Build Kernel for Poco X3 NFC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_surya
          ref: lineage-20
          path: kernel-source

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev libelf-dev flex bison cpio git curl zip unzip clang lld llvm python3

      - name: Prepare Config
        run: |
          cd kernel-source
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=/d' arch/arm64/configs/surya_defconfig || true
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_SIZE=/d' arch/arm64/configs/surya_defconfig || true
          sed -i '/CONFIG_DEBUG_INFO=/d' arch/arm64/configs/surya_defconfig || true
          echo 'CONFIG_CC_OPTIMIZE_FOR_SIZE=y' >> arch/arm64/configs/surya_defconfig
          echo 'CONFIG_DEBUG_INFO=n' >> arch/arm64/configs/surya_defconfig

      - name: Build Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 surya_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Check Image
        run: |
          ls -lh kernel-source/out/arch/arm64/boot/Image*

      - name: Download AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Copy Kernel
        run: |
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f kernel-source/out/arch/arm64/boot/Image ]; then
            cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "Kernel image not found!"
            exit 1
          fi

      - name: Create ZIP
        run: |
          cd AnyKernel3
          zip -r9 ../Poco-X3-NFC-Kernel.zip . -x "*.md" ".git/*"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Poco-X3-NFC-Kernel
          path: Poco-X3-NFC-Kernel.zip
